<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <!-- Background: Dark Near-Black (#151515) Rounded Rectangle -->
  <rect width="64" height="64" rx="16" fill="#151515" />
  
  <!-- Subtly Styled Hairline Accent Border (#D8C5A9) -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#D8C5A9" stroke-width="1.5" stroke-opacity="0.5" />
  
  <!-- Monogram: Elegant Serif S in Warm Cream (#F3EDE3) -->
  <text 
    x="50%" 
    y="54%" 
    dominant-baseline="middle" 
    text-anchor="middle" 
    font-family="'Playfair Display', 'Georgia', 'Times New Roman', serif" 
    font-size="30" 
    font-weight="700" 
    letter-spacing="-0.02em" 
    fill="#F3EDE3"
  >
    S
  </text>
</svg>